[pytest]
testpaths = tests
# The live Gemini smoke tests are excluded by default; run them with `pytest -m live` (scripts/run_live_tests.sh).
addopts = -m "not live"
markers =
    live: calls the real Gemini API; skipped unless AI_PROVIDER=gemini and GEMINI_API_KEY are set
filterwarnings =
    ignore::SyntaxWarning
    ignore::DeprecationWarning
